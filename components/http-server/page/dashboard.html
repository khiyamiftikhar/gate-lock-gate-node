<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard active">
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>ESP32 Panel</h3>
            </div>
            <div class="menu-item active" data-page="home">
                <span>🏠</span>
                <span>Home</span>
            </div>
            <div class="menu-item" data-page="ota">
                <span>⚡</span>
                <span>OTA Update</span>
            </div>
        </div>

        <div class="main-content">
            <div class="content-header">
                <h2>Dashboard</h2>
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>

            <div class="welcome-card">
                <h3>Welcome to ESP32 Control Panel</h3>
                <p>Use the menu on the left to navigate through different options.</p>
                <p style="margin-top: 15px;">Currently available: OTA Firmware Update</p>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
